name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Package index to publish to"
        required: true
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Eigen3 (required by the native build)
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install eigen

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,de,analysis]"

      - name: Run tests
        run: pytest -q

      - name: Run Ruff
        run: ruff check .

      - name: Build distributions
        run: |
          rm -rf build dist
          find . -maxdepth 2 -name "*.egg-info" -type d -exec rm -rf {} +
          python -m build

      - name: Check distributions
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: bsm-scanner-dist
          path: dist/*

  publish-testpypi:
    name: Publish to TestPyPI
    needs: validate
    if: ${{ inputs.target == 'testpypi' }}
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/bsm-scanner/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bsm-scanner-dist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: validate
    if: ${{ inputs.target == 'pypi' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bsm-scanner/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bsm-scanner-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
