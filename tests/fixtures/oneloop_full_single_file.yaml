functions:
- name: I3
  args:
  - Mphi_eff
  - Mphip_eff
  - Mpsi_eff
  expression: >
    -(
      (Mphi_eff**2 * log((Mpsi_eff**2) / (Mphi_eff**2))) /
      ((Mphi_eff**2 - Mphip_eff**2) * (Mphi_eff**2 - Mpsi_eff**2))
      +
      (Mphip_eff**2 * log((Mpsi_eff**2) / (Mphip_eff**2))) /
      ((Mphip_eff**2 - Mphi_eff**2) * (Mphip_eff**2 - Mpsi_eff**2))
    ) / ((4*pi) * (4*pi))
- name: F
  args:
  - x
  - y
  expression: >
    if_else(
      x == y,
      0.0,
      ((x + y) / 2.0) - ((x * y) / (x - y)) * log(x / y)
    )
- name: F2
  args:
  - x
  expression: >
    (1 - 6*x + 3*x**2 + 2*x**3 - 6*x**2*log(x)) / (6 * (1 - x)**4)
- name: ft
  args:
  - t
  - r
  expression: >
    if_else(
      r == 0.0,
      0.0,
      if_else(
        r > 0.0,
        sqrt(r) * log(abs((t - sqrt(r)) / (t + sqrt(r)))),
        2.0 * sqrt(-r) * atan2(sqrt(-r), t)
      )
    )
- name: G
  args:
  - x
  - y
  - Q
  expression: >
    if_else(
      (x > 0.0) and (y > 0.0) and (abs(x - y) > 0.001 * x),
      (
        (-16.0 / 3.0)
        + 5.0 * ((x + y) / Q)
        - 2.0 * (((x - y)**2) / Q**2)
        + (3.0 / Q) *
          (((x**2 + y**2) / (x - y)) - ((x**2 - y**2) / Q) + (((x - y)**3) / (3.0 * Q**2))) *
          log(x / y)
        + ((Q**2 - 2.0 * Q * (x + y) + (x - y)**2) / Q**3) *
          ft(x + y - Q, Q**2 - 2.0 * Q * (x + y) + (x - y)**2)
      ),
      (
        (-16.0 / 3.0)
        + 5.0 * ((x + y) / Q)
        - 2.0 * (((x - y)**2) / Q**2)
        + (3.0 / Q) *
          (
            (
              (x**2 + y**2)
              - ((x**2 - y**2) * (x - y) / Q)
              + (((x - y)**4) / (3.0 * Q**2))
            ) / y
          ) *
          (
            1.0
            - ((x - y) / y) / 2.0
            + (((x - y) / y)**2) / 3.0
            - (((x - y) / y)**3) / 4.0
            + (((x - y) / y)**4) / 5.0
          )
        + ((Q**2 - 2.0 * Q * (x + y) + (x - y)**2) / Q**3) *
          ft(x + y - Q, Q**2 - 2.0 * Q * (x + y) + (x - y)**2)
      )
    )
- name: G2
  args:
  - x
  expression: >
    (2 - 9*x + 18*x**2 - 11*x**3 + 6*x**3*log(x)) / (6 * (1 - x)**4)
- name: D1
  args:
  - x
  expression: >
    (-1 + x**2 - 2*x*log(x)) / (1 - x)**3
- name: D2
  args:
  - x
  expression: >
    (-2 + 2*x - (1 + x)*log(x)) / (1 - x)**3
- name: f
  value_type: complex
  args:
  - tau_i
  expression: >
    if_else(
      tau_i >= 1.0,
      asin(1.0 / sqrt(tau_i))**2,
      -(1.0 / 4.0) *
      (log((1 + sqrt(1 - tau_i)) / (1 - sqrt(1 - tau_i))) - 1j*pi)**2
    )
- name: LeptonGammaAmplitude
  value_type: complex
  args:
  - y_alpha
  - y_beta
  - mpsi
  - mphi
  expression: >
    ((conj(y_beta) * y_alpha) / (2 * (4*pi)**2 * mphi**2)) * F2((mpsi**2) / (mphi**2))
- name: LeptonGammaBR
  args:
  - y_alpha
  - y_beta
  - br_ab
  - mpsi
  - mphi
  expression: >
    ((3 * (4*pi)**3 * alpha_em) / (4 * GF**2)) * abs(LeptonGammaAmplitude(y_alpha, y_beta, mpsi, mphi))**2 * br_ab
- name: TriLeptonBR
  args:
  - m_alpha
  - m_beta
  - y_alpha
  - y_beta
  - br_ab
  - mpsi
  - mphi
  expression: >
    (
      (3 * (4*pi)**2 * alpha_em**2) / (8 * GF**2)
    ) * (
      (
        abs(
          ((conj(y_beta) * y_alpha) / (6 * (4*pi)**2 * mphi**2)) *
          G2((mpsi**2) / (mphi**2))
        )**2
        +
        abs(LeptonGammaAmplitude(y_alpha, y_beta, mpsi, mphi))**2 *
        ((16.0 / 3.0) * log(m_alpha / m_beta) - (22.0 / 3.0))
      )
      +
      (1.0 / 6.0) *
      abs(
        (
          0.5 * D1((mpsi**2) / (mphi**2)) * conj(y_beta) * y_beta * conj(y_beta) * y_alpha
          +
          abs((mpsi**2) / (mphi**2)) * D2((mpsi**2) / (mphi**2)) *
          conj(y_beta) * conj(y_beta) * y_beta * y_alpha
        ) / (4*pi*mphi*e_em)**2
      )**2
      +
      real(
        (-2.0) *
        (
          ((conj(y_beta) * y_alpha) / (6 * (4*pi)**2 * mphi**2)) *
          G2((mpsi**2) / (mphi**2))
        ) * conj(LeptonGammaAmplitude(y_alpha, y_beta, mpsi, mphi))
        +
        (1.0 / 3.0) *
        (
          ((conj(y_beta) * y_alpha) / (6 * (4*pi)**2 * mphi**2)) *
          G2((mpsi**2) / (mphi**2))
        ) *
        conj(
          (
            0.5 * D1((mpsi**2) / (mphi**2)) * conj(y_beta) * y_beta * conj(y_beta) * y_alpha
            +
            abs((mpsi**2) / (mphi**2)) * D2((mpsi**2) / (mphi**2)) *
            conj(y_beta) * conj(y_beta) * y_beta * y_alpha
          ) / (4*pi*mphi*e_em)**2
        )
        -
        (2.0 / 3.0) *
        LeptonGammaAmplitude(y_alpha, y_beta, mpsi, mphi) *
        conj(
          (
            0.5 * D1((mpsi**2) / (mphi**2)) * conj(y_beta) * y_beta * conj(y_beta) * y_alpha
            +
            abs((mpsi**2) / (mphi**2)) * D2((mpsi**2) / (mphi**2)) *
            conj(y_beta) * conj(y_beta) * y_beta * y_alpha
          ) / (4*pi*mphi*e_em)**2
        )
        +
        (-2.0) *
        conj(
          ((conj(y_beta) * y_alpha) / (6 * (4*pi)**2 * mphi**2)) *
          G2((mpsi**2) / (mphi**2))
        ) * LeptonGammaAmplitude(y_alpha, y_beta, mpsi, mphi)
        +
        (1.0 / 3.0) *
        conj(
          ((conj(y_beta) * y_alpha) / (6 * (4*pi)**2 * mphi**2)) *
          G2((mpsi**2) / (mphi**2))
        ) *
        (
          (
            0.5 * D1((mpsi**2) / (mphi**2)) * conj(y_beta) * y_beta * conj(y_beta) * y_alpha
            +
            abs((mpsi**2) / (mphi**2)) * D2((mpsi**2) / (mphi**2)) *
            conj(y_beta) * conj(y_beta) * y_beta * y_alpha
          ) / (4*pi*mphi*e_em)**2
        )
        -
        (2.0 / 3.0) *
        conj(LeptonGammaAmplitude(y_alpha, y_beta, mpsi, mphi)) *
        (
          (
            0.5 * D1((mpsi**2) / (mphi**2)) * conj(y_beta) * y_beta * conj(y_beta) * y_alpha
            +
            abs((mpsi**2) / (mphi**2)) * D2((mpsi**2) / (mphi**2)) *
            conj(y_beta) * conj(y_beta) * y_beta * y_alpha
          ) / (4*pi*mphi*e_em)**2
        )
      )
      +
      (1.0 / 3.0) * (
        2.0 *
        abs(
          (
            (-(g2 / cos_w) * sin_w**2) /
            (g2**2 * sin_w**2 * mZ**2)
          ) *
          ((conj(y_beta) * y_alpha * m_alpha * m_beta * g2) /
           (2 * (4*pi)**2 * mphi**2 * cos_w)) *
          F2((mpsi**2) / (mphi**2))
        )**2
        +
        abs(
          (
            ((g2 / cos_w) * (0.5 - sin_w**2)) /
            (g2**2 * sin_w**2 * mZ**2)
          ) *
          ((conj(y_beta) * y_alpha * m_alpha * m_beta * g2) /
           (2 * (4*pi)**2 * mphi**2 * cos_w)) *
          F2((mpsi**2) / (mphi**2))
        )**2
      )
    ) * br_ab
derived_scalars:
- name: ch
  expression: 1 - sh
- name: sH
  expression: sqrt(sh)
- name: cH
  expression: sqrt(ch)
- name: e_em
  expression: sqrt(4*pi*alpha_em)
- name: cos_w
  expression: mW / mZ
- name: sin_w
  expression: sqrt(1 - cos_w**2)
- name: g2
  expression: (2*mW) / vev
- name: mphi_sq
  expression: Mphi**2 - 0.5*k1*vev**2
- name: mphip_sq
  expression: sh*MH1**2 + ch*MH2**2 - 0.5*k4*vev**2
- name: MHA22
  expression: ch*MH2**2 + sh*MH1**2
- name: MHA12
  expression: cH*sH*(MH1**2 - MH2**2)
- name: MA02sq_denom
  expression: MHA22 - MA1**2
- name: MA02sq
  expression: MHA22 + (MHA12**2) / MA02sq_denom
- name: MA2
  expression: sqrt(MA02sq)
- name: ccommon
  expression: sh*MH1**2 + ch*MH2**2
- name: sa_raw
  expression: (MA2**2 - ccommon) / (MA2**2 - MA1**2)
- name: sa
  expression: min(max(sa_raw, 0.0), 1.0)
- name: ca
  expression: 1 - sa
- name: mphi
  expression: sqrt(mphi_sq)
- name: mphip
  expression: sqrt(mphip_sq)
- name: mu_phi
  expression: sqrt(2*sh*ch) * (MH1**2 - MH2**2) / vev
- name: i3
  expression: I3(mphi, mphip, Mpsi)
- name: k2
  expression: >
    (ch*MH1**2 + sh*MH2**2 + ca*MA1**2 + sa*MA2**2 - 2*Mphi**2) / vev**2
- name: k3
  expression: >
    ((ch*MH1**2 + sh*MH2**2) - (ca*MA1**2 + sa*MA2**2)) / vev**2
- name: tau_w
  expression: 4 * (mW / HiggsMass)**2
- name: tau_t
  expression: 4 * (mt / HiggsMass)**2
- name: tau_b
  expression: 4 * (mb / HiggsMass)**2
- name: tau_tau
  expression: 4 * (mtau / HiggsMass)**2
- name: tau_phi
  expression: 4 * (Mphi / HiggsMass)**2
derived_complex:
- name: ye
  expression: Reye + 1j*Imgye
- name: ymu
  expression: Reymu + 1j*Imgymu
- name: ytau
  expression: Reytau + 1j*Imgytau
- name: Ye
  expression: ReYe + 1j*ImgYe
- name: Ymu
  expression: ReYmu + 1j*ImgYmu
- name: Ytau
  expression: ReYtau + 1j*ImgYtau
- name: Yp
  expression: Reyp + 1j*Imgyp
- name: normalization
  expression: -(mu_phi * vev**2 * Mpsi * i3 / MN) * Yp
- name: A_w
  expression: -(2 + 3*tau_w + 3*tau_w*(2 - tau_w)*f(tau_w))
- name: A_t
  expression: 3*(2/3.0)**2 * (2*tau_t * (1 + (1 - tau_t)*f(tau_t)))
- name: A_b
  expression: 3*(-1/3.0)**2 * (2*tau_b * (1 + (1 - tau_b)*f(tau_b)))
- name: A_tau
  expression: (2*tau_tau * (1 + (1 - tau_tau)*f(tau_tau)))
- name: A_phi
  expression: ((k1 * vev**2) / (2 * Mphi**2)) * (-tau_phi + tau_phi**2 * f(tau_phi))
matrices:
- name: neutrino_mass_matrix
  value_type: complex_matrix
  rows:
  - - 2*Ye*ye*normalization
    - (Ye*ymu + Ymu*ye)*normalization
    - (Ye*ytau + Ytau*ye)*normalization
  - - (Ymu*ye + Ye*ymu)*normalization
    - 2*Ymu*ymu*normalization
    - (Ymu*ytau + Ytau*ymu)*normalization
  - - (Ytau*ye + Ye*ytau)*normalization
    - (Ytau*ymu + Ymu*ytau)*normalization
    - 2*Ytau*ytau*normalization
- name: S_matrix_1
  value_type: real_matrix
  rows:
  - - 6*lambda1
    - 2*lambda1
    - k1 + k2 + k3
    - k4
    - k1 + k2 - k3
    - k4
    - 2*lambda1
    - k1
  - - 2*lambda1
    - 6*lambda1
    - k1 + k2 - k3
    - k4
    - k1 + k2 + k3
    - k4
    - 2*lambda1
    - k1
  - - k1 + k2 + k3
    - k1 + k2 - k3
    - 6*lambda2
    - k5
    - 2*lambda2
    - k5
    - k1
    - 2*lambda2
  - - k4
    - k4
    - k5
    - 6*lambda3
    - k5
    - 2*lambda3
    - k4
    - k5
  - - k1 + k2 - k3
    - k1 + k2 + k3
    - 2*lambda2
    - k5
    - 6*lambda2
    - k5
    - k1
    - 2*lambda2
  - - k4
    - k4
    - k5
    - 2*lambda3
    - k5
    - 6*lambda3
    - k4
    - k5
  - - 2*lambda1
    - 2*lambda1
    - k1
    - k4
    - k1
    - k4
