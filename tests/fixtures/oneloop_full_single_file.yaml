  version: 0.2.0
  description: Full normal-ordering migration of the original oneloop model, with DM backend pieces documented separately when external micrOMEGAs integration is unavailable.
  ordering: normal
  tags:
  - oneloop
  - normal_ordering
  - full_migration
  - micromegas_pending
