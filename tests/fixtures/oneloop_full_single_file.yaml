    - '0'
    - '0'
  - - k3
    - '0'
    - 0.25*(k1 + k2 + k3)
    - '0'
    - 0.5*(k2 + k3)
  - - '0'
    - '0'
    - '0'
    - 0.25*k4
    - '0'
  - - 0.5*(k2 + k3)
    - '0'
    - 0.5*(k2 + k3)
    - '0'
