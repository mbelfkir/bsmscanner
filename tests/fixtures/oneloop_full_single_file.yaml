    col: 1
- name: Utau3
  value_type: complex
  projection:
    from: neutrino_svd
    quantity: u_complex
    row: 2
    col: 0
- name: theta13_angle
  value_type: real
  expression: asin(abs(Ue3))
- name: theta12_angle
  value_type: real
  expression: atan(abs(Ue2) / abs(Ue1))
- name: theta23_angle
  value_type: real
  expression: atan(abs(Umu3) / abs(Utau3))
- name: delta_numerator
  value_type: complex
  expression: conj(Ue1) * Ue3 * Utau1 * conj(Utau3)
- name: delta_denominator
  value_type: real
  expression: >
    (
      cos(theta12_angle) * cos(theta13_angle)**2 * cos(theta23_angle) * sin(theta13_angle)
      +
      cos(theta12_angle) * cos(theta23_angle) * sin(theta13_angle)
    ) / (sin(theta12_angle) * sin(theta23_angle))
- name: deltaCP_raw
  value_type: real
  expression: arg(delta_numerator / delta_denominator)
- name: deltaCP
  value_type: real
  expression: if_else(deltaCP_raw < 0, deltaCP_raw + 2*pi, deltaCP_raw)
- name: eta1
  value_type: real
  expression: fmod(arg(Ue1 / Ue3) / pi - deltaCP, 2)
- name: eta2
  value_type: real
  expression: fmod(arg(Ue2 / Ue3) / pi - deltaCP, 2)
- name: Theta12
  value_type: real
  expression: sin(theta12_angle)**2
- name: Theta13
  value_type: real
  expression: sin(theta13_angle)**2
- name: Theta23
  value_type: real
  expression: sin(theta23_angle)**2
- name: dm21_raw
  value_type: real
  expression: m2_raw**2 - m1_raw**2
- name: dm3l_raw
  value_type: real
  expression: m3_raw**2 - m1_raw**2
- name: scale
  value_type: real
  expression: sqrt((bf_dm21 / dm21_raw + bf_dm3l / dm3l_raw) / 2)
- name: m1
  value_type: real
  expression: m1_raw * scale
- name: m2
  value_type: real
  expression: m2_raw * scale
- name: m3
  value_type: real
  expression: m3_raw * scale
- name: dm21
  value_type: real
  expression: scale**2 * dm21_raw
- name: dm3l
  value_type: real
  expression: scale**2 * dm3l_raw
- name: sum_m
  value_type: real
  expression: m1 + m2 + m3
- name: deltaCP_deg
  value_type: real
  expression: >
    if_else((deltaCP * 180 / pi) > 180, (deltaCP * 180 / pi) - 360, deltaCP * 180 / pi)
- name: log10_dm21
  value_type: real
  expression: log(max(dm21, 1.0e-30)) / log(10)
- name: dm3l_meV
  value_type: real
  expression: dm3l * 1.0e3
- name: mbeta
  value_type: real
  expression: >
    sqrt(m1**2 + dm21 * (1 - (1 - Theta13) * (1 - Theta12)) + dm3l * Theta13)
- name: mbetabeta
  value_type: real
  expression: >
    abs(
      m1 * (1 - Theta12) * (1 - Theta13)
      +
      sqrt(dm21 + m1**2) * Theta12 * (1 - Theta13) * exp(1j * 2*pi * (eta2 - eta1))
      +
      sqrt(dm3l + dm21 + m1**2) * Theta13 * exp(1j * (-2*pi * (deltaCP + eta1)))
    )
- name: HiggsMass
  value_type: real
  expression: sqrt(2 * lambda1 * vev**2)
- name: HiggsRgg
  value_type: real
  expression: abs(1 + A_phi / (A_t + A_b + A_tau + A_w))**2
- name: mu_to_e_gamma
  value_type: real
  expression: LeptonGammaBR(ymu, ye, br_mu_to_e_nunu, Mpsi, Mphi)
- name: tau_to_e_gamma
  value_type: real
  expression: LeptonGammaBR(ytau, ye, br_tau_to_e_nunu, Mpsi, Mphi)
- name: tau_to_mu_gamma
  value_type: real
  expression: LeptonGammaBR(ytau, ymu, br_tau_to_mu_nunu, Mpsi, Mphi)
- name: mu_to_eee
  value_type: real
  expression: TriLeptonBR(mmu_GeV, me_GeV, ymu, ye, br_mu_to_e_nunu, Mpsi, Mphi)
- name: tau_to_eee
  value_type: real
  expression: TriLeptonBR(mtau_GeV, me_GeV, ytau, ye, br_tau_to_e_nunu, Mpsi, Mphi)
- name: tau_to_mumumu
  value_type: real
  expression: TriLeptonBR(mtau_GeV, mmu_GeV, ytau, ymu, br_tau_to_mu_nunu, Mpsi, Mphi)
- name: ObliqueT
  value_type: real
  expression: >
    (
      ch * F(MH1**2, Mphi**2)
      + sh * F(MH2**2, Mphi**2)
      + ca * F(MA1**2, Mphi**2)
      + sa * F(MA2**2, Mphi**2)
      - ch * ca * F(MH1**2, MA1**2)
      - ch * sa * F(MH1**2, MA2**2)
      - sh * ca * F(MH2**2, MA1**2)
      - sh * sa * F(MH2**2, MA2**2)
    ) / (16 * pi * sin_w**2 * mW**2)
- name: ObliqueS
  value_type: real
  expression: >
    (
      (2*sin_w**2 - 1) * G(Mphi**2, Mphi**2, mZ**2)
      + ch * ca * G(MH1**2, MA1**2, mZ**2)
      + ch * sa * G(MH1**2, MA2**2, mZ**2)
      + sh * ca * G(MH2**2, MA1**2, mZ**2)
      + sh * sa * G(MH2**2, MA2**2, mZ**2)
      + ch * log(MH1**2 / Mphi**2)
      + sh * log(MH2**2 / Mphi**2)
      + ca * log(MA1**2 / Mphi**2)
      + sa * log(MA2**2 / Mphi**2)
    ) / (24 * pi)
