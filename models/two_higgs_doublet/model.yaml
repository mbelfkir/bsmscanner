metadata:
  name: two_higgs_doublet_type2_corrected
  version: 0.2.0
  description: >
    CP-conserving, softly broken Z2 two-Higgs-doublet model of Type II (Branco et al.,
    Phys. Rept. 516 (2012) 1, arXiv:1106.0034) in physical-mass variables. Corrected copy of
    BSMScanner models/two_higgs_doublet v0.1.0: full lambda_1..5 inversion, Branco Eq. (176)
    stability, tree-level perturbative unitarity, exact oblique T (Branco Eq. 388), Type II
    Higgs coupling modifiers, B -> X_s gamma charged-Higgs bound. See CHANGES.md.
  tags: [2hdm, two_higgs_doublet, type_ii, higgs_sector, cp_conserving]
imports:
- parameters.yaml
- constants.yaml
- functions.yaml
- derived.yaml
- observables/observables.yaml
- constraints/theory_checks.yaml
- constraints/likelihoods.yaml
- constraints/higgs_kappa.yaml
- outputs.yaml
- scan.yaml
