metadata:
  name: zprime_simplified_dm_corrected
  version: 0.2.0
  description: >
    Vector-mediator s-channel simplified DM model, Dirac DM, universal quark coupling
    (ATLAS/CMS DM Forum, arXiv:1507.00966, Eq. 2.1), leptophobic. Corrected copy of BSMScanner
    models/zprime_simplified v0.1.0: Forum Eq. (2.3) width with quark thresholds; proxy collider cuts
    replaced by the spin-independent DM-nucleon cross section (Boveia et al., arXiv:1603.04156,
    Eqs. 4.1-4.3) against the LZ limit. See CHANGES.md.
  tags: [zprime, simplified_model, dark_matter, vector_mediator, direct_detection]
imports:
- parameters.yaml
- constants.yaml
- functions.yaml
- derived.yaml
- observables/observables.yaml
- constraints/theory_checks.yaml
- constraints/likelihoods.yaml
- outputs.yaml
- scan.yaml
