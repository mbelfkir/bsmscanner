theory_checks:
- {name: positive_masses, condition: "MZp > 0 and mchi > 0", fatal: true, message: Zprime simplified masses must be positive.}
- {name: perturbative_couplings, condition: "gq < sqrt(4*pi) and gchi < sqrt(4*pi)", fatal: true, message: A Zprime simplified coupling is non-perturbative.}
