scan:
  engine: de_scipy
  save_every: 1
  seed: 12345
  settings:
    objective: nll
    strategy: rand1bin
    maxiter: 40
    popsize: 12
    tol: 1.0e-2
    atol: 0.0
    mutation: [0.5, 1.0]
    recombination: 0.7
    init: latinhypercube
    updating: deferred
    workers: 1
    polish: false
    invalid_penalty: 1.0e+12
    save_invalid_points: true
    verbose: 2

statistics:
  enabled: true
  method: de_weighted
  credible_levels: [0.68, 0.95]
  output_samples: true
  include_observables: true
