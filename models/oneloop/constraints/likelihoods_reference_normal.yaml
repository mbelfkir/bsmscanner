likelihoods:
- {name: s12_nufit, kind: table_lookup, observable: s12, table_file: ../data/Normal/Theta12.csv, interpolation: cubic_spline, out_of_range_penalty_scale: 4.0e+4, out_of_range_penalty_cap: 1.0e+6}
- {name: s13_nufit, kind: table_lookup, observable: s13, table_file: ../data/Normal/Theta13.csv, interpolation: cubic_spline, out_of_range_penalty_scale: 4.0e+4, out_of_range_penalty_cap: 1.0e+6}
- {name: s23_nufit, kind: table_lookup, observable: s23, table_file: ../data/Normal/Theta23.csv, interpolation: cubic_spline, out_of_range_penalty_scale: 4.0e+4, out_of_range_penalty_cap: 1.0e+6}
- {name: delta_cp_nufit, kind: table_lookup, observable: deltaCP_deg, table_file: ../data/Normal/deltaCP.csv, interpolation: cubic_spline, out_of_range_penalty_scale: 4.0e+4, out_of_range_penalty_cap: 1.0e+6}
- {name: dm21_nufit, kind: table_lookup, observable: log10_dm21, table_file: ../data/Normal/dm21.csv, interpolation: cubic_spline, out_of_range_penalty_scale: 4.0e+4, out_of_range_penalty_cap: 1.0e+6}
- {name: dm3l_nufit, kind: table_lookup, observable: dm3l_meV, table_file: ../data/Normal/dm3l.csv, interpolation: cubic_spline, out_of_range_penalty_scale: 4.0e+4, out_of_range_penalty_cap: 1.0e+6}
- {name: sum_mnu_limit, kind: hard_cut, observable: sum_m, lower: 0.0, upper: 0.12}
- {name: higgs_diphoton, kind: gaussian, observable: HiggsRgg, mean: 1.088, sigma: 0.092}
- name: oblique_ST
  kind: multivariate_gaussian
  observables: [ObliqueS, ObliqueT]
  means: [-0.05, 0.0]
  covariance: [[0.0049, 0.003906], [0.003906, 0.0036]]
- {name: mu_to_e_gamma_limit, kind: hard_cut, observable: mu_to_e_gamma, lower: 0.0, upper: 3.1e-13}
- {name: tau_to_e_gamma_limit, kind: hard_cut, observable: tau_to_e_gamma, lower: 0.0, upper: 3.3e-08}
- {name: tau_to_mu_gamma_limit, kind: hard_cut, observable: tau_to_mu_gamma, lower: 0.0, upper: 2.2e-08}
- {name: mu_to_3e_limit, kind: hard_cut, observable: mu_to_eee, lower: 0.0, upper: 1.0e-12}
- {name: tau_to_3e_limit, kind: hard_cut, observable: tau_to_eee, lower: 0.0, upper: 2.7e-08}
- {name: tau_to_3mu_limit, kind: hard_cut, observable: tau_to_mumumu, lower: 0.0, upper: 2.1e-08}
