metadata:
  name: minimal_bl_gauge_corrected
  version: 0.2.0
  description: >
    Minimal (pure) gauged B-L model of Basso, Moretti, Pruna (arXiv:1106.4462): Z'_{B-L},
    complex singlet chi (B-L charge 2), three Majorana right-handed neutrinos, h-h' mixing.
    Corrected copy of BSMScanner models/minimal_bl v0.1.0: full Z' width (Eq. 3.7, incl. Majorana
    neutrinos and thresholds), Higgs signal strength with h1 -> N N and h1 -> Z'Z', LHC Run-2
    signal-strength input, and an LHC dilepton Z' limit. See CHANGES.md.
  tags: [minimal_bl, b_minus_l, zprime, right_handed_neutrinos, higgs_mixing]
imports:
- parameters.yaml
- constants.yaml
- functions.yaml
- derived.yaml
- observables/observables.yaml
- constraints/theory_checks.yaml
- constraints/likelihoods.yaml
- outputs.yaml
- scan.yaml
