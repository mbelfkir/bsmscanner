metadata:
  name: smeft_warsaw_dim6_corrected
  version: 0.2.0
  description: >
    Warsaw-basis dimension-six SMEFT (Grzadkowski et al., arXiv:1008.4884) at fixed Lambda = 1 TeV,
    tree-level/LO linear maps to the oblique parameters (Han-Skiba hep-ph/0412166) and Higgs coupling
    modifiers (Brivio-Trott arXiv:1706.08945; Wells-Zhang arXiv:1512.03056). Corrected copy of
    BSMScanner models/smeft_wilson v0.1.0; see CHANGES.md.
  tags: [smeft, warsaw_basis, dimension_six, wilson_coefficients]
imports:
- parameters.yaml
- constants.yaml
- functions.yaml
- derived.yaml
- observables/observables.yaml
- constraints/theory_checks.yaml
- constraints/likelihoods.yaml
- constraints/higgs_kappa.yaml
- outputs.yaml
- scan.yaml
