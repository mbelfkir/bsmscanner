metadata:
  name: leptoquark_s1_corrected
  version: 0.2.0
  description: >
    Scalar leptoquark S1 ~ (3bar, 1, 1/3) of the Buchmuller-Ruckl-Wyler classification
    (Phys. Lett. B 191 (1987) 442) with third-generation lepton couplings
    L = y_L^{ij} Qbar^C_i i tau_2 L_j S1 + y_R^{ij} ubar^C_i e_j S1 + h.c. (Angelescu et al.
    arXiv:1808.08179 Eq. 25). Replaces the representation-free proxy benchmark BSMScanner
    models/leptoquark_brw v0.1.0: b -> c tau nu (R_D, R_D*), B -> K nu nu, B_c lifetime, and
    LHC pair production. See CHANGES.md.
  tags: [leptoquark, s1, brw, flavor, rd, b_to_k_nu_nu]
imports:
- parameters.yaml
- constants.yaml
- functions.yaml
- derived.yaml
- observables/observables.yaml
- constraints/theory_checks.yaml
- constraints/likelihoods.yaml
- outputs.yaml
- scan.yaml
