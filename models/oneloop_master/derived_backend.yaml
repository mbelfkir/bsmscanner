derived_scalars:
- name: thetah_backend
  value_type: real
  expression: asin(sqrt(max(0.0, min(1.0, sh))))
  description: Backend-facing scalar mixing angle for the optional micrOMEGAs plugin.
- name: thetaa_backend
  value_type: real
  expression: -atan(MHA12 / MA02sq_denom)
  description: Backend-facing CP-odd scalar mixing angle for the optional micrOMEGAs plugin.
