- name: neutrino_observable_epsilon
  value_type: real
  expression: "1.0e-16"
- name: s13
  value_type: real
  expression: min(max(abs(Ue3)**2, 0.0), 1.0)
- name: c13_sq
  value_type: real
  expression: max(1.0 - s13, neutrino_observable_epsilon)
- name: s12
  value_type: real
  expression: min(max(abs(Ue2)**2 / c13_sq, 0.0), 1.0)
- name: s23
  value_type: real
  expression: min(max(abs(Umu3)**2 / c13_sq, 0.0), 1.0)
- name: s12_root
  value_type: real
  expression: sqrt(s12)
- name: c12_root
  value_type: real
  expression: sqrt(max(1.0 - s12, 0.0))
- name: s23_root
  value_type: real
  expression: sqrt(s23)
- name: c23_root
  value_type: real
  expression: sqrt(max(1.0 - s23, 0.0))
- name: s13_root
  value_type: real
  expression: sqrt(s13)
- name: c13_root
  value_type: real
  expression: sqrt(c13_sq)
- name: theta13_angle
  value_type: real
  expression: asin(s13_root)
- name: theta12_angle
  value_type: real
  expression: asin(s12_root)
- name: theta23_angle
  value_type: real
  expression: asin(s23_root)
- name: t12_deg
  value_type: real
  expression: theta12_angle * 180 / pi
- name: t13_deg
  value_type: real
  expression: theta13_angle * 180 / pi
- name: t23_deg
  value_type: real
  expression: theta23_angle * 180 / pi
- name: J
  value_type: real
  expression: imag(Ue1 * Umu2 * conj(Ue2) * conj(Umu1))
- name: Jmax
  value_type: real
  expression: s12_root * c12_root * s23_root * c23_root * s13_root * c13_sq
- name: delta_sin_raw
  value_type: real
  expression: J / max(Jmax, neutrino_observable_epsilon)
- name: delta_sin
  value_type: real
  expression: min(max(delta_sin_raw, -1.0), 1.0)
- name: delta_cos_denominator
  value_type: real
  expression: 2.0 * s12_root * c12_root * s23_root * c23_root * s13_root
- name: delta_cos_raw
  value_type: real
  expression: >
    (
      abs(Umu1)**2
      - s12 * c23_root**2
      - (1.0 - s12) * s23 * s13
    ) / max(delta_cos_denominator, neutrino_observable_epsilon)
- name: delta_cos
  value_type: real
  expression: min(max(delta_cos_raw, -1.0), 1.0)
- name: deltaCP_raw
  value_type: real
  expression: atan2(delta_sin, delta_cos)
- name: deltaCP
  value_type: real
  expression: >
    if_else(
      Jmax > neutrino_observable_epsilon,
      fmod(fmod(deltaCP_raw, 2*pi) + 2*pi, 2*pi),
      nan()
    )
- name: deltaCP_over_pi
  value_type: real
  expression: deltaCP / pi
- name: d_over_pi
  value_type: real
  expression: deltaCP_over_pi
# Dirac CP phase in degrees, PDG convention. Two explicit ranges:
#   deltaCP_deg_0_360     in [0, 360)    -- NuFIT publication convention
#   deltaCP_deg_m180_180  in [-180, 180] -- domain of core:data/nufit/*/deltaCP.csv
# A table_lookup likelihood must use the observable whose range matches the
# table abscissa; values outside the table get the out-of-range penalty.
- name: deltaCP_deg_0_360
  value_type: real
  expression: deltaCP * 180 / pi
- name: deltaCP_deg_m180_180
  value_type: real
  expression: >
    if_else(
      Jmax > neutrino_observable_epsilon,
      deltaCP_raw * 180 / pi,
      nan()
    )
# Backward-compatible alias of deltaCP_deg_0_360. Do NOT feed it to
# core:data/nufit/*/deltaCP.csv (use deltaCP_deg_m180_180).
- name: deltaCP_deg
  value_type: real
  expression: deltaCP_deg_0_360
- name: eta1
  value_type: real
  expression: fmod(fmod(arg(Ue1 / Ue3) - deltaCP, 2*pi) + 2*pi, 2*pi) / pi
- name: eta2
  value_type: real
  expression: fmod(fmod(arg(Ue2 / Ue3) - deltaCP, 2*pi) + 2*pi, 2*pi) / pi
- name: alpha21
  value_type: real
  expression: fmod(fmod(2.0 * arg(Ue2 / Ue1), 2*pi) + 2*pi, 2*pi)
- name: alpha31
  value_type: real
  expression: fmod(fmod(2.0 * (arg(Ue3 / Ue1) + deltaCP), 2*pi) + 2*pi, 2*pi)
- name: alpha21_deg
  value_type: real
  expression: alpha21 * 180 / pi
- name: alpha31_deg
  value_type: real
  expression: alpha31 * 180 / pi
- name: scale
  value_type: real
  # Overall mass-scale factor of the ANCHORED ("_scaled") quantities below. A general
  # mass matrix only predicts *ratios* between the three masses, so `scale` fixes the
  # missing overall factor by matching dm21_raw/dm3l_raw to NuFit's best-fit dm21/dm3l
  # (same convention as FlavorPy's `nscale`). The unsuffixed quantities (m1, m2, m3,
  # dm21, dm3l, sum_m, mbeta, mbetabeta, ...) are the model's own, UNSCALED values,
  # in the unit of the neutrino mass matrix.
  # Which to use: a model whose overall scale is a free parameter (flavour models)
  # uses the `_scaled` ones; a model that predicts the absolute scale itself tests it
  # with the unsuffixed ones (the `_scaled` ones would always fit NuFit by construction).
  expression: sqrt((bf_dm21 / dm21_raw + bf_dm3l / dm3l_raw) / 2)
# --- unscaled: the model's own values (matrix unit) -------------------------------
- name: m1
  value_type: real
  expression: m1_raw
- name: m2
  value_type: real
  expression: m2_raw
- name: m3
  value_type: real
  expression: m3_raw
- name: dm21
  value_type: real
  expression: dm21_raw
- name: dm3l
  value_type: real
  expression: dm3l_raw
- name: sum_m
  value_type: real
  expression: m1 + m2 + m3
- name: sum_mnu
  value_type: real
  expression: sum_m
- name: log10_dm21
  value_type: real
  expression: log(max(dm21, 1.0e-30)) / log(10)
- name: dm3l_meV
  value_type: real
  expression: dm3l * 1.0e+3
- name: m_b
  value_type: real
  expression: mbeta
- name: m_bb
  value_type: real
  expression: mbetabeta
# --- scaled: anchored to the NuFit best-fit splittings (eV) -----------------------
- name: m1_scaled
  value_type: real
  expression: m1_raw * scale
- name: m2_scaled
  value_type: real
  expression: m2_raw * scale
- name: m3_scaled
  value_type: real
  expression: m3_raw * scale
- name: dm21_scaled
  value_type: real
  expression: scale**2 * dm21_raw
- name: dm3l_scaled
  value_type: real
  expression: scale**2 * dm3l_raw
- name: sum_m_scaled
  value_type: real
  expression: m1_scaled + m2_scaled + m3_scaled
- name: sum_mnu_scaled
  value_type: real
  expression: sum_m_scaled
- name: log10_dm21_scaled
  value_type: real
  expression: log(max(dm21_scaled, 1.0e-30)) / log(10)
- name: dm3l_meV_scaled
  value_type: real
  expression: dm3l_scaled * 1.0e+3
- name: m_b_scaled
  value_type: real
  expression: mbeta_scaled
- name: m_bb_scaled
  value_type: real
  expression: mbetabeta_scaled
# Scale-independent: the ratio of the splittings is the same raw or scaled.
- name: r
  value_type: real
  expression: dm21 / dm3l
